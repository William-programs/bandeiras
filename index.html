<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exemplo pedagógico de galeria de imagens utilizando Lazy Loading com Intersection Observer, animações suaves em CSS e boas práticas de SEO.">
  <title>Lazy Loading com Animações e SEO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho-pedagogico">
    <h1>Galeria de Imagens com Lazy Loading</h1>
    <p class="subtitulo">
      Demonstração prática de carregamento tardio (<em>Lazy Loading</em>) utilizando a API 
      <code>IntersectionObserver</code> para otimizar a performance e o SEO da página.
    </p>
  </header>

  <main>
    <    <section class="gallery" aria-label="Galeria educativa de fotografias">
      
      <figure class="card-imagem">
        <img 
          class="lazy" 
          src="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 600 400'%3E%3C/svg%3E"
          data-src="img/images.png" 
          alt="Fotografia de paisagem natural mostrando montanhas e um lago cristalino ao amanhecer"
          width="600" 
          height="400"
        >
        <figcaption><strong>Figura 1:</strong> Fotografia de paisagem natural (Geografia Física).</figcaption>
      </figure>

      <figure class="card-imagem">
        <img 
          class="lazy" 
          src="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 600 400'%3E%3C/svg%3E"
          data-src="img/images.jpg" 
          alt="Fotografia de arquitetura urbana com edifícios modernos de vidro vistos de baixo para cima"
          width="600" 
          height="400"
        >
        <figcaption><strong>Figura 2:</strong> Fotografia de arquitetura urbana (Urbanismo e Design).</figcaption>
      </figure>

      <figure class="card-imagem">
        <img 
          class="lazy" 
          src="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 600 400'%3E%3C/svg%3E"
          data-src="img/images (1).png" 
          alt="Imagem de satélite mostrando o planeta Terra iluminado à noite visto do espaço"
          width="600" 
          height="400"
        >
        <figcaption><strong>Figura 3:</strong> Observação terrestre via satélite (Ciências e Astronomia).</figcaption>
      </figure>

    </section>
  </main>

  <footer class="rodape-pedagogico">
    <p>Material Didático • Desenvolvimento Web Front-End e Otimização de Performance</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
